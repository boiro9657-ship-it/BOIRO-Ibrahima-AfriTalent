       <div class="col-lg-7">

    <h2 id="ContaNou">Contactez-nous</h2>

    <form id="contactForm">

        <div class="mb-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" id="nom">
            <small id="nomError" class="text-danger"></small>
        </div>
        <div class="mb-3">
            <label class="form-label">Prénom</label>
            <input type="text" class="form-control" id="prenom">
            <small id="prenomError" class="text-danger"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email">
            <small id="emailError" class="text-danger"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Sujet</label>

            <select class="form-select" id="sujet">
                <option value="">Choisir un sujet</option>
                <option>Demande d'information</option>
                <option>Support technique</option>
                <option>Partenariat</option>
                <option>Autre</option>
            </select>

            <small id="sujetError" class="text-danger"></small>
        </div>

        <div class="mb-3">
            <label class="form-label">Message</label>

            <textarea
                class="form-control"
                rows="5"
                id="message"></textarea>

            <small id="messageError" class="text-danger"></small>
        </div>

        <button type="submit" class="btn btn-primary">
            Envoyer
        </button>

    </form>

    <div id="successMessage"
         class="alert alert-success mt-4 d-none">
        Votre message a été envoyé avec succès !
    </div>

</div>

<div class="col-lg-5">

    <div class="card p-4 shadow">

        <h3 id="Cord">Nos coordonnées</h3>

        <p><i class="fa-solid fa-envelope"></i> contact@afritalent.com</p>

        <p><i class="fa-solid fa-phone"></i> +221 77 123 45 67</p>

        <p><i class="fa-solid fa-location-dot"></i> 25 Avenue de l'Innovation,
           Dakar, Sénégal</p>

    </div>

</div>
